<!-- 初回部員情報登録フォーム（オンデマンドロード用・カレンダーUIテイストのポップアップ） -->
<div id="register-overlay" class="register-overlay">
    <div class="register-modal">
        <div class="modal-top-bar">
            <div class="modal-handle"></div>
            <button type="button" class="btn-modal-close hidden" id="btn-close-register">✕</button>
        </div>

        <div class="register-header">
            <div class="register-badge" id="reg-badge">🏸 はじめに</div>
            <h2 class="register-title" id="reg-title">部員プロフィール登録</h2>
            <p class="register-desc" id="reg-desc">出欠管理カレンダーを利用するため、初回のみお名前・所属をご登録ください。</p>
        </div>

        <div class="line-profile-preview">
            <div class="line-icon-badge">LINE</div>
            <div class="line-info">
                <span class="line-label">連携中のLINEアカウント:</span>
                <span class="line-name" id="reg-line-name">取得中...</span>
            </div>
        </div>

        <form id="register-form" novalidate>
            <!-- 氏名 -->
            <div class="form-group">
                <label class="form-label">お名前（漢字） <span class="req">*</span></label>
                <div class="form-row-2">
                    <input type="text" id="reg-last-name" class="form-input" placeholder="例: 山田" required>
                    <input type="text" id="reg-first-name" class="form-input" placeholder="例: 太郎" required>
                </div>
            </div>

            <!-- ふりがな -->
            <div class="form-group">
                <label class="form-label">ふりがな <span class="req">*</span></label>
                <div class="form-row-2">
                    <input type="text" id="reg-kana-last" class="form-input" placeholder="例: ヤマダ" required>
                    <input type="text" id="reg-kana-first" class="form-input" placeholder="例: タロウ" required>
                </div>
            </div>

            <!-- 学年 -->
            <div class="form-group">
                <label class="form-label">学年 <span class="req">*</span></label>
                <div class="chip-group" id="grade-chip-group">
                    <button type="button" class="reg-chip" data-val="1年">1年</button>
                    <button type="button" class="reg-chip" data-val="2年">2年</button>
                    <button type="button" class="reg-chip" data-val="3年">3年</button>
                    <button type="button" class="reg-chip" data-val="4年">4年</button>
                    <button type="button" class="reg-chip" data-val="5年">5年</button>
                    <button type="button" class="reg-chip" data-val="6年">6年</button>
                    <button type="button" class="reg-chip" data-val="大学院">大学院</button>
                    <button type="button" class="reg-chip" data-val="OBOG">OBOG</button>
                    <button type="button" class="reg-chip" data-val="その他">その他</button>
                </div>
                <div id="grade-detail-container" class="hidden" style="margin-top: 8px;">
                    <input type="text" id="reg-grade-detail" class="form-input" placeholder="">
                </div>
                <input type="hidden" id="reg-grade" required>
            </div>

            <!-- 大学名 -->
            <div class="form-group">
                <label class="form-label">大学名 <span class="req">*</span></label>
                <div class="chip-group" id="univ-chip-group">
                    <button type="button" class="reg-chip" data-val="東京大学">東京大学</button>
                    <button type="button" class="reg-chip" data-val="日本赤十字看護大学">日本赤十字看護大学</button>
                    <button type="button" class="reg-chip" data-val="その他">その他</button>
                </div>
                <div id="univ-other-container" class="univ-other-container hidden" style="margin-top: 8px;">
                    <input type="text" id="reg-univ-other" class="form-input" placeholder="例: 早稲田大学">
                </div>
                <input type="hidden" id="reg-univ" required>
            </div>

            <!-- 性別 -->
            <div class="form-group">
                <label class="form-label">性別 <span class="req">*</span></label>
                <div class="chip-group" id="sex-chip-group">
                    <button type="button" class="reg-chip" data-val="男性">男性</button>
                    <button type="button" class="reg-chip" data-val="女性">女性</button>
                    <button type="button" class="reg-chip" data-val="その他">その他</button>
                </div>
                <input type="hidden" id="reg-sex" required>
            </div>

            <div id="reg-error-msg" class="reg-error hidden"></div>

            <button type="submit" id="btn-submit-register" class="btn-submit-register">
                登録してカレンダーを開始
            </button>
        </form>
    </div>
</div>

    <style>
    /* カレンダーアプリとテイストを統一したポップアップモーダルスタイル */
    .register-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.45);
        backdrop-filter: blur(5px);
        -webkit-backdrop-filter: blur(5px);
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px;
        animation: regFadeIn 0.25s ease-out;
    }

    @keyframes regFadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    .register-modal {
        background: #ffffff;
        width: 100%;
        max-width: 440px;
        max-height: 88vh;
        overflow-y: auto;
        border-radius: 20px;
        padding: 18px 20px 24px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.16);
        border: 1px solid rgba(226, 232, 240, 0.9);
        animation: regPopUp 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        -webkit-overflow-scrolling: touch;
        box-sizing: border-box;
    }

    @keyframes regPopUp {
        from { transform: scale(0.94) translateY(12px); opacity: 0; }
        to { transform: scale(1) translateY(0); opacity: 1; }
    }

    .modal-top-bar {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 8px;
    }

    .modal-handle {
        width: 36px;
        height: 4px;
        background: #cbd5e1;
        border-radius: 2px;
    }

    .btn-modal-close {
        position: absolute;
        right: -4px;
        top: -4px;
        background: #f1f5f9;
        border: none;
        width: 28px;
        height: 28px;
        border-radius: 50%;
        color: #64748b;
        font-size: 0.9rem;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: all 0.15s;
    }

    .btn-modal-close:hover {
        background: #e2e8f0;
        color: #1e293b;
    }

    .register-header {
        text-align: center;
        margin-bottom: 16px;
    }

    .register-badge {
        display: inline-block;
        background: rgba(6, 199, 85, 0.12);
        color: #049f43;
        font-size: 0.76rem;
        font-weight: bold;
        padding: 4px 10px;
        border-radius: 20px;
        margin-bottom: 6px;
    }

    .register-title {
        font-size: 1.25rem;
        font-weight: 800;
        color: #1e293b;
        margin-bottom: 4px;
        letter-spacing: -0.3px;
    }

    .register-desc {
        font-size: 0.8rem;
        color: #64748b;
        line-height: 1.45;
    }

    .line-profile-preview {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        padding: 9px 12px;
        border-radius: 12px;
        margin-bottom: 16px;
    }

    .line-icon-badge {
        background: #06c755;
        color: #fff;
        font-size: 0.65rem;
        font-weight: 900;
        padding: 3px 6px;
        border-radius: 6px;
        letter-spacing: 0.5px;
    }

    .line-info {
        display: flex;
        flex-direction: column;
        font-size: 0.8rem;
    }

    .line-label {
        font-size: 0.68rem;
        color: #94a3b8;
    }

    .line-name {
        font-weight: bold;
        color: #334155;
    }

    .form-group {
        margin-bottom: 14px;
    }

    .form-label {
        display: block;
        font-size: 0.82rem;
        font-weight: bold;
        color: #334155;
        margin-bottom: 6px;
    }

    .form-label .req {
        color: #ef4444;
        margin-left: 2px;
    }

    .form-row-2 {
        display: flex;
        gap: 8px;
    }

    .form-input {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd5e1;
        border-radius: 10px;
        font-size: 0.88rem;
        outline: none;
        transition: all 0.2s;
        box-sizing: border-box;
        font-family: inherit;
        background: #ffffff;
    }

    .form-input:focus {
        border-color: #06c755;
        box-shadow: 0 0 0 3px rgba(6, 199, 85, 0.15);
    }

    .chip-group {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
    }

    /* カレンダータブのチップと同一スタイル */
    .reg-chip {
        padding: 7px 12px;
        background: #f1f5f9;
        border: 1px solid #e2e8f0;
        border-radius: 8px;
        font-size: 0.82rem;
        font-weight: bold;
        color: #475569;
        cursor: pointer;
        transition: all 0.15s ease;
        -webkit-tap-highlight-color: transparent;
    }

    .reg-chip:active {
        transform: scale(0.96);
    }

    .reg-chip.active {
        background: #06c755;
        border-color: #06c755;
        color: #ffffff;
        box-shadow: 0 2px 6px rgba(6, 199, 85, 0.28);
    }

    .reg-error {
        background: #fef2f2;
        border: 1px solid #fca5a5;
        color: #b91c1c;
        padding: 8px 12px;
        border-radius: 10px;
        font-size: 0.8rem;
        margin-bottom: 12px;
        text-align: center;
    }

    /* 保存ボタンと同一テイストの登録ボタン */
    .btn-submit-register {
        width: 100%;
        background: #06c755;
        color: #ffffff;
        border: none;
        padding: 14px;
        border-radius: 14px;
        font-size: 0.98rem;
        font-weight: bold;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(6, 199, 85, 0.35);
        transition: all 0.2s;
        margin-top: 10px;
    }

    .btn-submit-register:active {
        transform: scale(0.98);
    }

    .btn-submit-register:disabled {
        background: #94a3b8;
        box-shadow: none;
        cursor: not-allowed;
    }
</style>
